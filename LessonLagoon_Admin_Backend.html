.adm{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 64px)}

.side a.on,.side a:hover{background:rgba(255,255,255,.1);color:#fff}.side a.up{background:var(--acc);color:#fff;justify-content:center;margin:2px 0 8px}.side a.up:hover{background:#ec6544}

.main{padding:26px 30px 80px;overflow:auto;min-width:0}.main h1{margin:0 0 4px;font-size:26px;letter-spacing:-.4px}.subt{color:var(--mut);margin-bottom:20px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi small{color:var(--mut);font-weight:600}.kpi b{display:block;font-size:24px;margin-top:2px}.kpi.hot{border-color:var(--acc);background:#FFF6F2}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.box h3{margin:0 0 12px;font-size:16.5px}

.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}.row.tot{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

function shade(h,a){let n=parseInt(String(h).slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,(n>>8&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return `rgb(${r},${g},${b})`}

  <div class="kpis"><div class="kpi hot"><small>Pending approvals</small><b>${pendingN()}</b><a class="sm" style="color:var(--acc)" href="#/approvals">Review now →</a></div><div class="kpi"><small>Paid revenue</small><b>${mvr(rev)}</b><span class="sm mut">${paid.length} paid orders</span></div><div class="kpi"><small>Customers</small><b>${customers().length}</b><span class="sm mut">+${customers().filter(u=>u.joined>=today().slice(0,8)+'01').length} this month</span></div><div class="kpi"><small>Live resources</small><b>${S.products.filter(p=>p.status==='Published').length}</b><span class="sm mut">${drafts.length} drafts</span></div><div class="kpi"><small>Points outstanding</small><b>${outstanding.toLocaleString()}</b><span class="sm mut">= ${mvr(outstanding*100/S.settings.ptsPerMVRValue)}</span></div></div>
  <div class="two"><div class="box"><h3>Needs your attention</h3><div class="todo">${todo.length?todo.map(t=>`<a href="${t[3]}"><span style="font-size:20px">${t[1]}</span><b>${t[2]}</b><span class="mut">→</span></a>`).join(''):'<div class="empty" style="padding:20px"><span>🎉</span>All caught up.</div>'}</div></div>
   <div class="box"><h3>Quick actions</h3><div class="drop" data-a="pick" style="padding:22px"><div class="big">⬆️</div><b>Upload new resources</b><div class="sm mut">Drop PDFs, Word or PowerPoint files anywhere, on any screen</div></div>
    <div class="flex wr mt"><button class="btn sm ghost" data-a="newCamp">📣 New campaign</button><button class="btn sm ghost" data-a="go" data-h="#/campaigns">🎟️ Add coupon</button><button class="btn sm ghost" data-a="go" data-h="#/landing">🎨 Edit landing page</button><button class="btn sm ghost" data-a="go" data-h="#/customers">👥 Customers</button></div></div></div>
  <div class="two"><div class="box"><h3>Sales this week (MVR)</h3><div class="bars">${S.sales7.map(s=>`<div style="height:${s[1]/mx*100}%"><em>${s[1].toLocaleString()}</em><span>${s[0]}</span></div>`).join('')}</div><div style="height:16px"></div></div>
   <div class="box"><h3>Top resources</h3>${[...S.products].sort((a,b)=>b.sales-a.sales).slice(0,5).map(p=>`<div class="ci"><img src="${coverOf(p)}"><div class="t">${esc(p.title)}<div class="sm mut">${p.sales.toLocaleString()} downloads/sales</div></div><b>${p.price?mvr(p.price):'Free'}</b></div>`).join('')}</div></div>
  ${c?`<div class="box" style="border-left:5px solid ${c.accent}"><b>📣 ${esc(c.name)}</b> is live · ${c.pct}% off · ${c.mult}× points · ends in <b data-cd="${c.end}"></b></div>`:''}`},

upload(){const Q=S.queue;const done=Q.filter(q=>q.state==='done').length,ready=Q.filter(q=>q.state==='ready').length,busy=Q.filter(q=>q.state==='queued'||q.state==='processing').length,bad=Q.filter(q=>q.state==='error').length;
  return `<div class="ph"><div><h1>Upload resources</h1><div class="subt">Drop files here, or anywhere on any screen. Title, subject, grade, page count, cover and watermarked previews are filled in automatically. You just check the price and publish.</div></div>
   <div class="flex wr"><button class="btn sm ghost" data-a="csvTpl">⬇️ CSV template</button><button class="btn sm ghost" data-a="csvImport">📥 Fill details from CSV</button></div></div>
  <div class="drop" id="dz" data-a="pick" ondragover="event.preventDefault()"><div class="big">📂</div><b style="font-size:17px">Drop PDF, Word or PowerPoint files</b><div class="sm mut">or click to choose · many files at once · up to ${S.settings.maxUploadMB} MB each · press <b>U</b> from any screen</div></div>
  <div class="steps3"><div><b>1 · Drop</b>Files are checked, fingerprinted and duplicates flagged.</div><div><b>2 · Auto-fill</b>Title, grade and subject come from the file name.</div><div><b>3 · Previews</b>First ${S.settings.previewPages} pages rendered and watermarked.</div><div><b>4 · Publish</b>Set the price once for all, or per file.</div></div>
  ${Q.length?`<div class="box" style="padding:14px 18px"><div class="flex sb wr"><b>${Q.length} file(s) · ${ready} ready · ${busy} processing · ${bad} need attention · ${done} published</b>
     <div class="flex wr"><button class="btn sm" data-a="publishAll" ${ready?'':'disabled'}>🚀 Publish all ready (${ready})</button><button class="btn sm ghost" data-a="draftAll" ${ready?'':'disabled'}>Save all as drafts</button><button class="btn sm ghost" data-a="clearDone">Clear finished</button></div></div>
     <div class="pbar mt"><div style="width:${Q.length?Math.round((ready+done+bad)/Q.length*100):0}%"></div></div></div>
   ${Q.length>1?`<div class="applybar"><b style="align-self:center">Apply to all ▸</b>
     <div><label>Subject</label><select class="inp" id="ab-cat">${catOpts('')}</select></div><div><label>Grade</label><select class="inp" id="ab-grade"><option value="">—</option>${opts(S.grades)}</select></div>
     <div><label>Curriculum</label><select class="inp" id="ab-curr"><option value="">—</option>${opts(S.curricula)}</select></div><div><label>Price (MVR)</label><input class="inp" id="ab-price" type="number" min="0" placeholder="e.g. 50" style="width:100px"></div>
     <div><label>Min price (MVR)</label><input class="inp" id="ab-min" type="number" min="0" placeholder="auto" style="width:100px"></div><div><label>Preview pages</label><input class="inp" id="ab-pv" type="number" min="1" max="10" placeholder="${S.settings.previewPages}" style="width:80px"></div>
     <button class="btn acc sm" data-a="applyAll">Apply</button></div>`:''}
   <div id="queue">${Q.map(qCard).join('')}</div>`:`<div class="empty"><span>🗂️</span>No files in the queue yet. Your uploads will appear here while previews are generated.</div>`}
  <div class="note mt">🛡️ <b>How files are protected:</b> originals go to private storage and are only ever downloaded through short-lived signed links after purchase. Customers only see the watermarked preview images; the watermark is part of the pixels, not an overlay.</div>`},

resources(){const f=window._rf||(window._rf={q:'',st:(location.hash.split('f=')[1]||'All'),cat:'',sel:[]});if(location.hash.includes('f='))f.st=decodeURIComponent(location.hash.split('f=')[1]);
  const list=S.products.filter(p=>(f.st==='All'||p.status===f.st)&&(!f.cat||p.cat===f.cat)&&(!f.q||(p.title+' '+p.grade+' '+catName(p.cat)).toLowerCase().includes(f.q.toLowerCase())));
  const n=st=>S.products.filter(p=>st==='All'||p.status===st).length;f.sel=f.sel.filter(id=>P(id));
  return `<div class="ph"><div><h1>Resources</h1><div class="subt">${S.products.length} resources · edit prices inline · previews and watermarks are generated automatically.</div></div><button class="btn acc" data-a="pick">⬆️ Upload resources</button></div>
  <div class="flex wr" style="margin-bottom:12px"><input class="inp" style="max-width:300px" placeholder="Search title, grade, subject…" value="${esc(f.q)}" id="rq">
   ${['All','Published','Draft','Archived'].map(s=>`<span class="chip ${f.st===s?'on':''}" data-a="rst" data-v="${s}">${s} (${n(s)})</span>`).join('')}
   <select class="inp" style="max-width:200px" id="rcat"><option value="">All subjects</option>${opts(S.categories.map(c=>[c.id,c.name]),f.cat)}</select></div>
  ${f.sel.length?`<div class="applybar"><b style="align-self:center">${f.sel.length} selected ▸</b><button class="btn sm" data-a="bulk" data-v="Published">Publish</button><button class="btn sm ghost" data-a="bulk" data-v="Draft">Unpublish</button><button class="btn sm ghost" data-a="bulk" data-v="Archived">Archive</button><button class="btn sm ghost" data-a="bulk" data-v="feature">★ Feature</button>
    <div><label>Subject</label><select class="inp" id="bk-cat">${catOpts('')}</select></div><button class="btn sm ghost" data-a="bulk" data-v="cat">Set subject</button>
    <div><label>Price (MVR)</label><input class="inp" id="bk-price" type="number" min="0" style="width:90px"></div><button class="btn sm ghost" data-a="bulk" data-v="price">Set price</button>
    <button class="btn sm ghost" data-a="bulk" data-v="none">✕ Clear</button></div>`:''}
  <div class="tw"><table class="t"><tr><th><input type="checkbox" data-a="selAll" ${list.length&&list.every(p=>f.sel.includes(p.id))?'checked':''}></th><th></th><th>Resource</th><th>File</th><th>Price (MVR)</th><th>Min 🔒</th><th>Status</th><th>Featured</th><th>Ver.</th><th>Sales</th><th></th></tr>
  ${list.map(p=>`<tr><td><input type="checkbox" data-a="sel" data-id="${p.id}" ${f.sel.includes(p.id)?'checked':''}></td><td><img src="${coverOf(p)}" style="width:58px;height:46px;object-fit:cover;border-radius:8px;cursor:pointer" data-a="editP" data-id="${p.id}"></td>
   <td style="min-width:220px"><b style="cursor:pointer" data-a="editP" data-id="${p.id}">${esc(p.title)}</b><div class="sm mut">${esc(p.grade)} · ${catIc(p.cat)} ${esc(catName(p.cat))}${!p.short?' · <span style="color:var(--warn)">no description</span>':''}</div></td>
   <td class="sm"><span class="badge b-type">${p.type}</span> ${p.pages} ${p.type==='PPTX'?'slides':'pages'}</td>
   <td><input class="inp s" style="width:84px" type="number" min="0" value="${p.price/100}" data-p="${p.id}" data-k="price"></td><td>${p.price?`<input class="inp s" style="width:74px" type="number" min="0" value="${p.min/100}" data-p="${p.id}" data-k="min">`:'<span class="mut sm">Free</span>'}</td>
   <td>${pStatus(p.status)}</td><td>${sw(p.featured,'feat',p.id)}</td><td class="sm">v${p.ver}</td><td>${p.sales}</td>
   <td style="white-space:nowrap"><button class="btn xs" data-a="editP" data-id="${p.id}">Edit</button> <button class="btn xs ghost" data-a="newVer" data-id="${p.id}" title="Upload a new version of the file">⤴ New file</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">No resources match.</td></tr>'}</table></div>
  <p class="sm mut mt">🔒 The minimum price is never shown to customers. Campaigns, coupons, welcome offers and points can never push a sale below it.</p>`},

categories(){const cnt=id=>S.products.filter(p=>p.cat===id).length;
  return `<h1>Subjects & grades</h1><div class="subt">These lists power the upload auto-fill, store filters and the "Shop by subject" section.</div>
  <div class="two"><div class="box"><h3>Subjects</h3><table class="t"><tr><th>Icon</th><th>Name</th><th>Resources</th><th></th></tr>
   ${S.categories.map((c,i)=>`<tr><td><input class="inp s" style="width:56px;text-align:center" value="${esc(c.ic)}" data-cat="${i}" data-k="ic"></td><td><input class="inp s" value="${esc(c.name)}" data-cat="${i}" data-k="name"></td><td>${cnt(c.id)}</td><td><button class="btn xs ghost" data-a="delCat" data-id="${i}" ${cnt(c.id)?'disabled title="Move its resources first"':''}>Delete</button></td></tr>`).join('')}</table>
   <div class="flex mt"><input class="inp" id="ncic" placeholder="🎨" style="max-width:64px;text-align:center"><input class="inp" id="ncname" placeholder="New subject, e.g. Art"><button class="btn sm" data-a="addCat">Add</button></div></div>
  <div><div class="box"><h3>Grades</h3><div class="flex wr">${S.grades.map((g,i)=>`<span class="chip">${esc(g)} <span data-a="delGrade" data-id="${i}" style="color:var(--bad)">✕</span></span>`).join('')}</div><div class="flex mt"><input class="inp" id="ngrade" placeholder="e.g. Grade 11"><button class="btn sm" data-a="addGrade">Add</button></div></div>
   <div class="box"><h3>Curricula</h3><div class="flex wr">${S.curricula.map((g,i)=>`<span class="chip">${esc(g)} <span data-a="delCurr" data-id="${i}" style="color:var(--bad)">✕</span></span>`).join('')}</div><div class="flex mt"><input class="inp" id="ncurr" placeholder="e.g. IB PYP"><button class="btn sm" data-a="addCurr">Add</button></div></div></div></div>`},

approvals(){const L=S.orders.filter(o=>o.status==='AWAITING_VERIFICATION');
  return `<h1>Pending verifications</h1><div class="subt">Check the slip against the expected amount, then approve. You also get each slip by email with Approve / Reject buttons.</div>
  ${L.length?L.map(o=>{const cu=U(o.uid);const age=Math.max(0,Math.round((Date.now()-new Date(o.at))/36e5));const mismatch=o.slip.amount!==o.total;return `<div class="box"><div class="flex wr" style="align-items:flex-start;gap:20px"><img src="${slipImage(o)}" style="width:140px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in" data-a="zoom" data-src="${slipImage(o)}">
   <div style="flex:1;min-width:240px"><div class="flex wr"><b style="font-size:18px">${o.no}</b>${statusBadge(o.status)}${age>12?`<span class="badge b-rej">⏰ ${age}h waiting</span>`:`<span class="badge b-grey">${age}h ago</span>`}${o.dup?'<span class="badge b-rej">⚠️ Possible duplicate slip</span>':''}${mismatch?'<span class="badge b-rej">≠ Amount mismatch</span>':''}</div>
    <div class="mt"><b>${esc(cu.name)}</b> · ${esc(cu.email)}</div><div class="sm mut">${o.items.map(i=>esc(i.title)).join(', ')}</div>
    <div class="flex mt wr"><div class="kpi" style="padding:8px 14px"><small>Expected</small><b style="font-size:18px">${mvr(o.total)}</b></div><div class="kpi" style="padding:8px 14px;${mismatch?'border-color:var(--bad);background:#FFF5F5':''}"><small>Slip says</small><b style="font-size:18px">${mvr(o.slip.amount)}</b></div><div class="kpi" style="padding:8px 14px"><small>Reference</small><b style="font-size:15px">${esc(o.slip.ref)}</b></div><div class="kpi" style="padding:8px 14px"><small>Sender</small><b style="font-size:15px">${esc(o.slip.sender)}</b></div></div></div>
   <div class="flex" style="flex-direction:column;align-items:stretch"><button class="btn" data-a="approveM" data-id="${o.no}">✅ Approve</button><button class="btn red" data-a="rejectM" data-id="${o.no}">✕ Reject</button><button class="btn ghost sm" data-a="ownerMail" data-id="${o.no}">📧 View email</button></div></div></div>`}).join(''):`<div class="empty"><span>🎉</span>All caught up. No slips waiting.</div>`}`},

orders(){const f=window._of||(window._of={st:'All',q:''});const sts=['All','AWAITING_VERIFICATION','AWAITING_TRANSFER','PAID','COMPLETED_FREE','PAYMENT_REJECTED','REFUNDED','EXPIRED'];
  const L=[...S.orders].reverse().filter(o=>(f.st==='All'||o.status===f.st)&&(!f.q||(o.no+U(o.uid).name).toLowerCase().includes(f.q.toLowerCase())));
  const stale=S.orders.filter(o=>o.status==='AWAITING_TRANSFER'&&Date.now()-new Date(o.at)>S.settings.slipExpiryHours*36e5);
  return `<div class="ph"><div><h1>Orders</h1><div class="subt">${S.orders.length} orders · every status change is recorded in the order timeline and audit log.</div></div><div class="flex wr"><button class="btn sm ghost" data-a="expire" ${stale.length?'':'disabled'}>⏰ Expire ${stale.length} unpaid past ${S.settings.slipExpiryHours}h</button><button class="btn sm ghost" data-a="ordersCsv">⬇️ Export CSV</button></div></div>
  <div class="flex wr" style="margin-bottom:12px"><input class="inp" id="oq" style="max-width:260px" placeholder="Order no. or customer" value="${esc(f.q)}">${sts.map(s=>`<span class="chip ${f.st===s?'on':''}" data-a="ost" data-v="${s}">${s==='All'?'All':(STATUS[s]||[0,s])[1]} (${S.orders.filter(o=>s==='All'||o.status===s).length})</span>`).join('')}</div>
  <div class="tw"><table class="t"><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Points used</th><th>Status</th><th>Placed</th><th></th></tr>
  ${L.map(o=>`<tr><td><b style="cursor:pointer" data-a="order" data-id="${o.no}">${o.no}</b></td><td>${esc(U(o.uid).name)}</td><td class="sm">${o.items.map(i=>esc(i.title)).join('<br>')}</td><td>${mvr(o.total)}</td><td>${o.pointsUsed||'—'}</td><td>${statusBadge(o.status)}</td><td class="sm">${o.at.replace('T',' ')}</td>
   <td style="white-space:nowrap">${o.status==='AWAITING_VERIFICATION'?`<button class="btn xs" data-a="approveM" data-id="${o.no}">Review</button>`:''} <button class="btn xs ghost" data-a="order" data-id="${o.no}">Open</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No orders.</td></tr>'}</table></div>`},

customers(){const f=window._cf||(window._cf={q:'',seg:''});const L=customers().filter(u=>(!f.q||(u.name+u.email+u.tags.join(' ')+u.code).toLowerCase().includes(f.q.toLowerCase()))&&(!f.seg||inSeg(u,f.seg)));
  return `<div class="ph"><div><h1>Customers</h1><div class="subt">${customers().length} customers · Google sign-in · every new customer automatically receives the welcome offer and ${S.settings.signupPts} points.</div></div><button class="btn ghost" data-a="custCsv">⬇️ Export CSV</button></div>
  <div class="flex wr" style="margin-bottom:12px"><input class="inp" id="cq" style="max-width:300px" placeholder="Search name, email, tag or code…" value="${esc(f.q)}"><span class="chip ${!f.seg?'on':''}" data-a="cseg" data-v="">Everyone</span>${S.segments.map(s=>`<span class="chip ${f.seg===s.rule?'on':''}" data-a="cseg" data-v="${esc(s.rule)}">${esc(s.name)} (${customers().filter(u=>inSeg(u,s.rule)).length})</span>`).join('')}</div>
  <div class="tw"><table class="t"><tr><th>Customer</th><th>Joined</th><th>Source</th><th>Orders</th><th>Spent</th><th>Points</th><th>Email consent</th><th>Welcome offer</th><th>Tags</th></tr>
  ${L.map(u=>{const os=S.orders.filter(o=>o.uid===u.id);const sp=os.filter(o=>o.status==='PAID').reduce((a,o)=>a+o.total,0);const wa=u.welcome&&u.welcome.status==='active'&&u.welcome.expires>Date.now();
   return `<tr style="cursor:pointer" data-a="cust" data-id="${u.id}"><td><div class="flex"><div class="av" style="background:${u.color};width:32px;height:32px;font-size:12px">${initials(u.name)}</div><div><b>${esc(u.name)}</b>${u.blocked?' <span class="badge b-rej">blocked</span>':''}<div class="sm mut">${esc(u.email)}</div></div></div></td><td class="sm">${u.joined}</td><td class="sm">${esc(u.source)}</td><td>${os.length}</td><td>${mvr(sp)}</td><td><b>${u.points}</b>${u.pending?`<span class="sm mut"> +${u.pending}</span>`:''}</td><td>${u.consent?'✅':'—'}</td><td>${u.paid?'<span class="badge b-grey">used</span>':wa?'<span class="badge b-off">active</span>':'<span class="badge b-grey">expired</span>'}</td><td>${u.tags.map(t=>`<span class="badge b-blue">${esc(t)}</span>`).join(' ')}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No customers match.</td></tr>'}</table></div>`},

campaigns(){return `<div class="ph"><div><h1>Campaigns & coupons</h1><div class="subt">Campaigns switch on and off automatically by date. The banner and countdown appear on the storefront while live.</div></div><div class="flex"><button class="btn ghost" data-a="sendCamp">✉️ Email a group</button><button class="btn acc" data-a="newCamp">＋ New campaign</button></div></div>
  <div class="tw"><table class="t"><tr><th>Campaign</th><th>Type</th><th>Discount</th><th>Points</th><th>Applies to</th><th>Dates</th><th>Status</th><th></th></tr>${S.campaigns.map(c=>{const live=c.active&&Date.now()>=c.start&&Date.now()<=c.end;const ended=Date.now()>c.end;return `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.accent}"></span> <b>${esc(c.name)}</b><div class="sm mut">${esc(c.banner)}</div></td><td>${esc(c.type)}</td><td>${c.pct}%</td><td>${c.mult}×</td><td class="sm">${c.scope==='all'?'Everything':esc(catName(c.scope))}</td><td class="sm">${new Date(c.start).toLocaleDateString('en-GB')} → ${new Date(c.end).toLocaleDateString('en-GB')}</td>
   <td><span class="badge ${live?'b-paid':ended?'b-grey':c.active?'b-blue':'b-wait'}">${live?'Live':ended?'Ended':c.active?'Scheduled':'Paused'}</span>${live?`<div class="sm mut">ends in <span data-cd="${c.end}"></span></div>`:''}</td>
   <td style="white-space:nowrap"><button class="btn xs ghost" data-a="editCamp" data-id="${c.id}">Edit</button> <button class="btn xs ghost" data-a="togCamp" data-id="${c.id}">${c.active?'Pause':'Activate'}</button> <button class="btn xs ghost" data-a="dupCamp" data-id="${c.id}">Duplicate</button></td></tr>`}).join('')}</table></div>

function qCard(q){const m=q.meta;return `<div class="qcard ${q.state==='error'?'bad':q.state==='done'?'done':''}" id="q-${q.id}"><div class="qprev" id="qp-${q.id}">${qLeft(q)}</div>

   <div class="qf2"><div><label class="f">Short description <a class="sm" style="color:var(--pri);cursor:pointer" data-a="autoDesc" data-id="${q.id}">✨ write for me</a></label><input class="inp" data-q="${q.id}" data-k="short" value="${esc(m.short)}" placeholder="One line that sells it"></div><div><label class="f">Price (MVR)</label><input class="inp" type="number" min="0" data-q="${q.id}" data-k="price" value="${m.price}"></div><div><label class="f">Min price 🔒</label><input class="inp" type="number" min="0" data-q="${q.id}" data-k="min" value="${m.min}"></div><div><label class="f">Preview pages</label><input class="inp" type="number" min="1" max="10" data-q="${q.id}" data-k="pv" value="${m.pv}"></div><div><label class="f">Featured</label>${sw(m.featured,'qfeat',q.id)}</div></div>
   <div id="qe-${q.id}">${qActions(q)}</div></div></div>`}
const fsize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function qLeft(q){const r=q.res;if(!r)return `<div class="cv" style="display:grid;place-items:center;font-size:30px">⏳</div><div class="proc">${(q.steps||['Waiting in queue…']).map((s,i)=>`<div class="${i<q.si?'ok':i===q.si?'run':''}">${i<q.si?'✅':i===q.si?'⏳':'○'} ${s}</div>`).join('')}${q.err?`<div class="er">⛔ ${esc(q.err)}</div>`:''}</div>`;
  return `<img class="cv" src="${q.cover||r.cover}" alt="cover"><div class="pv">${r.wm.map(u=>`<img src="${u}" data-a="zoom" data-src="${u}">`).join('')}</div><div class="sm"><b>${r.type}</b> · ${r.pages||'?'} ${r.type==='PPTX'?'slides':'pages'} detected${r.note?`<div class="help">ℹ️ ${esc(r.note)}</div>`:''}</div><a class="sm" style="color:var(--pri);cursor:pointer" data-a="qCover" data-id="${q.id}">🖼️ Use my own cover image</a>`}
function qState(q){return q.state==='processing'?'<span class="badge b-blue">Processing…</span>':q.state==='queued'?'<span class="badge b-grey">Queued</span>':q.state==='error'?'<span class="badge b-rej">Needs attention</span>':q.state==='done'?`<span class="badge b-paid">${q.published?'Published':'Saved as draft'} ✓</span>`:'<span class="badge b-paid">Ready</span>'}
function qProblems(q){const m=q.meta,e=[];if(!m.title.trim())e.push('Add a title');if(!m.cat)e.push('Choose a subject');if(!m.grade)e.push('Choose a grade');if(+m.price<0)e.push('Price can’t be negative');if(+m.price>0&&!(+m.min>0))e.push('Set a minimum price above 0');if(+m.price>0&&+m.min>+m.price)e.push('Minimum price is higher than the price');if(q.dup)e.push('Same file as “'+q.dup+'” — remove it or publish anyway');return e}
function qActions(q){if(q.state==='done')return `<div class="flex mt"><button class="btn xs ghost" data-a="editP" data-id="${q.pid}">Open resource</button></div>`;
  if(q.state==='error')return `<div class="warnbox mt">⛔ ${esc(q.err)}</div><div class="flex mt"><button class="btn sm ghost" data-a="qRemove" data-id="${q.id}">Remove</button></div>`;
  const pr=qProblems(q);const ready=q.state==='ready';const hard=pr.filter(x=>!x.startsWith('Same file'));
  return `${pr.length&&ready?`<div class="warnbox mt">${pr.map(esc).join(' · ')}</div>`:''}<div class="flex mt wr"><button class="btn sm" data-a="qPublish" data-id="${q.id}" ${ready&&!hard.length?'':'disabled'}>🚀 Publish</button><button class="btn sm ghost" data-a="qDraft" data-id="${q.id}" ${ready&&q.meta.title.trim()?'':'disabled'}>Save draft</button><button class="btn sm ghost" data-a="qRemove" data-id="${q.id}">Remove</button>
   <span class="sm mut">${+q.meta.price>0?`Max discount ${Math.max(0,Math.round((1-q.meta.min/q.meta.price)*100))}% · customer pays at least ${mvr(Math.max(q.meta.min*100,Math.ceil(q.meta.price*100*(1-S.settings.maxPointsPct/100))))}`:'Free resource · instant download after Google sign-in'}</span></div>`}
function qRefresh(q){const a=$('#qp-'+q.id),b=$('#qe-'+q.id),c=$('#qs-'+q.id),card=$('#q-'+q.id);if(a)a.innerHTML=qLeft(q);if(b)b.innerHTML=qActions(q);if(c)c.innerHTML=qState(q);if(card)card.className='qcard '+(q.state==='error'?'bad':q.state==='done'?'done':'')}
</script>
<script>
/* ================= MODALS ================= */
function modal(html,wide){$('#layer').innerHTML=`<div class="ov" data-a="bgclose"><div class="modal ${wide?'wide':''}"><button class="x" data-a="close">✕</button>${html}</div></div>`}
function closeLayer(){$('#layer').innerHTML=''}
function confirmBox(title,body,okLabel,onOk,danger){window._ok=onOk;modal(`<h2>${title}</h2><p class="mut">${body}</p><div class="flex mt"><button class="btn ${danger?'red':''}" data-a="okConfirm">${okLabel}</button><button class="btn ghost" data-a="close">Cancel</button></div>`)}
const curTab=()=>(location.hash.split('/')[1]||'dash').split('?')[0];
function rerender(){if(!me())return route();const y=window.scrollY;$('#root').innerHTML=shell(curTab());window.scrollTo(0,y);afterRender(curTab())}

/* ---------- Upload queue ---------- */
let running=false;
function enqueue(files){files=[...files];if(!files.length)return;if(curTab()!=='upload')location.hash='#/upload';
  const s=S.settings;let added=0;
  for(const f of files){const g=guessMeta(f.name);const price=+s.defaultPrice||0;
    S.queue.push({id:tok().slice(0,8),name:f.name,size:f.size,file:f,state:'queued',si:-1,steps:null,res:null,meta:{title:g.title,cat:g.cat,grade:g.grade,curr:S.curricula[0],short:'',price,min:price?Math.max(1,Math.round(price*(s.defaultMinPct/100))):0,pv:s.previewPages,featured:false}});added++}
  toast(`📂 ${added} file(s) added · building previews…`);setTimeout(()=>{rerender();runQueue()},30)}
async function runQueue(){if(running)return;running=true;
  try{let q;while((q=S.queue.find(x=>x.state==='queued'))){q.state='processing';qRefresh(q);
    try{const r=await processFile(q.file,Math.max(1,Math.min(10,+q.meta.pv||S.settings.previewPages)),(steps,i)=>{q.steps=steps;q.si=i;qRefresh(q)});
      q.res=r;q.state='ready';
      const d=S.products.find(p=>p.file&&p.file.hash===r.hash)||S.queue.find(x=>x!==q&&x.res&&x.res.hash===r.hash);if(d)q.dup=d.title||d.meta.title;
      if(r.pages&&+q.meta.pv>r.pages)q.meta.pv=r.pages;
      const pv=document.querySelector(`[data-q="${q.id}"][data-k="pv"]`);if(pv)pv.value=q.meta.pv;
    }catch(e){q.state='error';q.err=e.message||String(e)}
    qRefresh(q);updateUploadHeader()}}
  finally{running=false}}
function updateUploadHeader(){if(curTab()==='upload'){const y=window.scrollY;const active=document.activeElement;const keep=active&&active.dataset&&active.dataset.q?[active.dataset.q,active.dataset.k,active.selectionStart]:null;rerender();window.scrollTo(0,y);if(keep){const el=document.querySelector(`[data-q="${keep[0]}"][data-k="${keep[1]}"]`);if(el){el.focus();try{el.setSelectionRange(keep[2],keep[2])}catch(e){}}}}}
function publishQ(q,publish){if(q.state!=='ready')return false;const m=q.meta,r=q.res;if(publish&&qProblems(q).some(x=>!x.startsWith('Same file')))return false;
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);let slug=slugify(m.title)||id;if(S.products.some(p=>p.slug===slug))slug+='-'+id.slice(-3);
  const price=Math.round(+m.price*100),min=price?Math.round(+m.min*100):0;const pv=Math.max(1,Math.min(+m.pv||1,r.wm.length));
  const p={id,slug,title:m.title.trim(),short:m.short.trim(),cat:m.cat,grade:m.grade||'All grades',type:r.type,pages:r.pages||r.wm.length,price,min,featured:!!m.featured,rating:0,rc:0,color:r.color,ic:catIc(m.cat),status:publish?'Published':'Draft',sales:0,curr:m.curr,ver:1,pv,custom:true,cover:true,
    versions:[{v:1,at:today(),note:'First release',file:r.name}],file:{name:r.name,size:r.size,hash:r.hash},created:today(),updated:today(),tags:[]};
  r.raw.forEach((u,i)=>DB.put('raw:'+id+':'+i,u));r.wm.forEach((u,i)=>DB.put('pv:'+id+':'+i,u));DB.put('cv:'+id,q.cover||r.cover);FILES[id]=q.file;
  S.products.unshift(p);q.state='done';q.published=publish;q.pid=id;q.file=null;audit(publish?'Resource published':'Resource saved as draft',p.title+' · '+(price?mvr(price):'Free'));save();return true}

/* ---------- Pricing helpers ---------- */
function setPrice(p,k,val){const v=Math.round(Math.max(0,+val||0)*100);if(k==='price'){p.price=v;if(!v)p.min=0;else if(!p.min||p.min>v)p.min=Math.max(100,Math.round(v*S.settings.defaultMinPct/100))}else{if(v>p.price){toast('⛔ Minimum price can’t be higher than the price');return false}if(p.price&&v<=0){toast('⛔ Paid resources need a minimum price above 0');return false}p.min=v}
  p.updated=today();audit('Price changed',p.title+' · price '+mvr(p.price)+' · min '+mvr(p.min));save();return true}

/* ---------- Resource editor ---------- */
function editP(id){const p=P(id);if(!p)return;const pv=previewsOf(p);const owners=S.ent.filter(e=>e.pid===id).length;closeLayer();
  modal(`<div class="flex" style="gap:16px;align-items:flex-start"><img src="${coverOf(p)}" style="width:140px;border-radius:12px"><div style="flex:1"><div class="flex wr">${pStatus(p.status)}<span class="badge b-type">${p.type} · ${p.pages} ${p.type==='PPTX'?'slides':'pages'}</span><span class="badge b-grey">v${p.ver}</span><span class="badge b-blue">${owners} owner(s)</span></div><h2 style="margin-top:8px">${esc(p.title)}</h2><div class="sm mut">/${esc(p.slug)} · updated ${p.updated}</div>
   <div class="flex wr mt">${p.status!=='Published'?`<button class="btn sm" data-a="pStatus" data-id="${id}" data-v="Published">🚀 Publish</button>`:`<button class="btn sm ghost" data-a="pStatus" data-id="${id}" data-v="Draft">Unpublish</button>`}<button class="btn sm ghost" data-a="newVer" data-id="${id}">⤴ Upload new version</button><button class="btn sm ghost" data-a="dupP" data-id="${id}">Duplicate</button><button class="btn sm ghost" data-a="storefront" data-id="${id}">👁️ View in store</button></div></div></div>
  <div class="two mt"><div><h3>Details</h3><label class="f">Title</label><input class="inp" data-pp="${id}" data-k="title" value="${esc(p.title)}"><label class="f">Short description</label><textarea class="inp" rows="3" data-pp="${id}" data-k="short">${esc(p.short)}</textarea>
    <div class="three"><div><label class="f">Subject</label><select class="inp" data-pp="${id}" data-k="cat">${catOpts(p.cat)}</select></div><div><label class="f">Grade</label><select class="inp" data-pp="${id}" data-k="grade">${opts(S.grades,p.grade)}</select></div><div><label class="f">Curriculum</label><select class="inp" data-pp="${id}" data-k="curr">${opts(S.curricula,p.curr)}</select></div></div>
    <label class="f">Search tags (comma separated)</label><input class="inp" data-pp="${id}" data-k="tags" value="${esc((p.tags||[]).join(', '))}" placeholder="worksheet, revision, term 2"></div>
   <div><h3>Pricing</h3><div class="two"><div><label class="f">Price (MVR, 0 = free)</label><input class="inp" type="number" min="0" data-p="${id}" data-k="price" value="${p.price/100}"></div><div><label class="f">Minimum price 🔒</label><input class="inp" type="number" min="0" data-p="${id}" data-k="min" value="${p.min/100}" ${p.price?'':'disabled'}></div></div>
    <div class="help">${p.price?`Max possible discount ${Math.round((1-p.min/p.price)*100)}%. Points can cover up to ${S.settings.maxPointsPct}% of the price.`:'Free resources download instantly after Google sign-in.'}</div>
    <div class="tog mt"><span>★ Featured on home page</span>${sw(p.featured,'feat',id)}</div>
    <h3 class="mt">Previews <span class="sm mut">(watermarked)</span></h3><div class="thumbs">${pv.map(u=>`<img src="${u}" data-a="zoom" data-src="${u}">`).join('')||'<span class="mut sm">No previews yet.</span>'}</div>
    <div class="flex mt wr"><label class="sm">Show first</label><input class="inp s" style="width:64px" type="number" min="1" max="10" id="pvn" value="${p.pv}"><label class="sm">pages</label><button class="btn xs" data-a="setPv" data-id="${id}">Update previews</button>${p.custom?`<button class="btn xs ghost" data-a="pCover" data-id="${id}">🖼️ Change cover</button>`:''}</div></div></div>
  <h3 class="mt">File & versions</h3><div class="tw"><table class="t"><tr><th>Version</th><th>Date</th><th>File</th><th>What changed</th></tr>${[...p.versions].reverse().map(v=>`<tr><td><b>v${v.v}</b>${v.v===p.ver?' <span class="badge b-paid">current</span>':''}</td><td class="sm">${v.at}</td><td class="sm mono">${esc(v.file)}</td><td class="sm">${esc(v.note)}</td></tr>`).join('')}</table></div>
  <div class="flex mt sb wr"><span class="sm mut">${p.file?esc(p.file.name)+' · '+fsize(p.file.size):''}</span><div class="flex">${p.status!=='Archived'?`<button class="btn sm ghost" data-a="pStatus" data-id="${id}" data-v="Archived">Archive</button>`:''}<button class="btn sm red" data-a="delP" data-id="${id}">Delete</button></div></div>`,true)}
function newVersion(id,file){const p=P(id);window._nv={id,file};
  modal(`<h2>⤴ New version of “${esc(p.title)}”</h2><p class="mut sm">Customers who own it get the new file in their Library. Previews are rebuilt automatically.</p>
   <div class="note">📄 <b>${esc(file.name)}</b> · ${fsize(file.size)}</div><label class="f">What changed? (shown to customers)</label><input class="inp" id="nvnote" placeholder="e.g. Added 6 word problems and fixed answer key">
   <label class="flex sm mt"><input type="checkbox" id="nvmail" checked> Email the ${S.ent.filter(e=>e.pid===id).length} customer(s) who own it</label><div id="nvproc" class="proc mt"></div>
   <div class="flex mt"><button class="btn" data-a="doNewVer">Upload version ${p.ver+1}</button><button class="btn ghost" data-a="close">Cancel</button></div>`)}
async function doNewVersion(){const{id,file}=window._nv;const p=P(id);const note=$('#nvnote').value.trim()||'Updated file';const notify=$('#nvmail').checked;const box=$('#nvproc');
  try{const r=await processFile(file,p.pv||S.settings.previewPages,(steps,i)=>{box.innerHTML=steps.map((s,k)=>`<div class="${k<i?'ok':k===i?'run':''}">${k<i?'✅':k===i?'⏳':'○'} ${s}</div>`).join('')});
    for(let i=0;i<10;i++){DB.del('raw:'+id+':'+i);DB.del('pv:'+id+':'+i)}r.raw.forEach((u,i)=>DB.put('raw:'+id+':'+i,u));r.wm.forEach((u,i)=>DB.put('pv:'+id+':'+i,u));
    if(!p.custom||!IMG['cv:'+id])DB.put('cv:'+id,r.cover);p.custom=true;p.cover=true;p.type=r.type;p.pages=r.pages||p.pages;p.pv=Math.min(p.pv,r.wm.length);p.ver++;p.versions.push({v:p.ver,at:today(),note,file:file.name});p.file={name:file.name,size:file.size,hash:r.hash};p.updated=today();FILES[id]=file;
    if(notify)S.ent.filter(e=>e.pid===id).forEach(e=>{const u=U(e.uid);mail(S,u.email,'newVersion',{name:u.name,title:p.title,version:p.ver,note})});
    audit('New version uploaded',p.title+' → v'+p.ver+' · '+note);save();closeLayer();toast(`✅ ${esc(p.title)} is now v${p.ver}${notify?' · owners emailed':''}`);rerender()}
  catch(e){box.innerHTML=`<div class="er">⛔ ${esc(e.message)}</div>`}}
async function setPreviewCount(id,n){const p=P(id);n=Math.max(1,Math.min(10,n|0));
  if(p.custom){const have=Object.keys(IMG).filter(k=>k.startsWith('raw:'+id+':')).length;
    if(n>have){if(FILES[id]){toast('⏳ Rendering more pages…');const r=await processFile(FILES[id],n);r.raw.forEach((u,i)=>DB.put('raw:'+id+':'+i,u));r.wm.forEach((u,i)=>DB.put('pv:'+id+':'+i,u));n=Math.min(n,r.wm.length)}
      else{n=have;toast(`ℹ️ Only ${have} page(s) were rendered at upload. Use “Upload new version” to render more.`)}}}
  p.pv=n;audit('Preview pages changed',p.title+' · '+n+' pages');save();editP(id);rerender()}
async function restampAll(){let n=0;for(const p of S.products.filter(x=>x.custom)){for(let i=0;i<10;i++){const raw=IMG['raw:'+p.id+':'+i];if(!raw)break;DB.put('pv:'+p.id+':'+i,await stamp(raw));n++}}
  Object.keys(artCache).filter(k=>k.startsWith('syn')).forEach(k=>delete artCache[k]);audit('Watermark re-applied','“'+S.settings.watermark+'” on '+n+' uploaded preview pages');save();toast(`🔁 Watermark re-applied to all previews (${n} uploaded pages + sample resources)`)}

/* ---------- Orders / approvals ---------- */
function approveModal(no){const o=S.orders.find(x=>x.no===no);const cu=U(o.uid);const mismatch=o.slip.amount!==o.total;const earn=Math.floor(o.total/100)*S.settings.ptsPerMVR*(o.mult||1);
  modal(`<span class="badge b-paid">APPROVE PAYMENT</span><h2 class="mt">${o.no} · ${mvr(o.total)}</h2><div class="two"><div><div class="row"><span>Customer</span><b>${esc(cu.name)}</b></div>${o.items.map(i=>`<div class="row sm"><span>${esc(i.title)}</span><span>${mvr(i.final)}</span></div>`).join('')}${o.pointsUsed?`<div class="row sm"><span>Points used</span><span>${o.pointsUsed}</span></div>`:''}<div class="row tot"><span>Expected</span><span>${mvr(o.total)}</span></div><div class="row"><span>Slip amount</span><b style="color:${mismatch?'var(--bad)':'var(--ok)'}">${mvr(o.slip.amount)}</b></div><div class="row"><span>Reference</span><span>${esc(o.slip.ref)}</span></div>
   ${mismatch?'<div class="warnbox mt">≠ The slip amount does not match. Check your bank statement before approving.</div>':''}${o.dup?'<div class="warnbox mt">⚠️ This slip image looks like one already used on another order.</div>':''}
   <div class="note mt">Approving will: unlock ${o.items.length} download(s) · add ${earn} pending points · ${!cu.paid&&cu.refBy?'reward the referrer · ':''}email the customer.</div></div><div style="text-align:center"><img src="${slipImage(o)}" style="max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line)"></div></div>
  <div class="flex mt"><button class="btn" style="padding:13px 24px" data-a="doApprove" data-id="${no}">✅ Confirm approval</button><button class="btn red" data-a="rejectM" data-id="${no}">Reject instead</button><button class="btn ghost" data-a="close">Cancel</button></div>`,true)}
function rejectModal(no){const o=S.orders.find(x=>x.no===no);
  modal(`<span class="badge b-rej">REJECT SLIP</span><h2 class="mt">${o.no}</h2><label class="f">Reason (sent to the customer)</label><select class="inp" id="rreason"><option>Amount does not match the order total</option><option>Slip is unclear, please upload a clearer photo</option><option>Transfer not received in our account</option><option>Reference does not match the order number</option></select><label class="f">Extra note (optional)</label><input class="inp" id="rnote" placeholder="e.g. We received MVR 110 instead of MVR 119">
  <p class="sm mut">The order stays open so the customer can upload a new slip. Points used stay on hold.</p><div class="flex"><button class="btn red" data-a="doReject" data-id="${no}">Confirm rejection</button><button class="btn ghost" data-a="close">Cancel</button></div>`)}
function grant(uid,pid){if(!S.ent.some(e=>e.uid===uid&&e.pid===pid))S.ent.push({uid,pid,at:today()})}
function approve(no){const o=S.orders.find(x=>x.no===no);if(o.status!=='AWAITING_VERIFICATION')return toast('Already processed');const u=U(o.uid);o.status='PAID';if(o.tokens)o.tokens.used=true;
  o.items.forEach(i=>{grant(u.id,i.pid);const p=P(i.pid);if(p)p.sales++});
  if(o.pointsUsed){u.held=Math.max(0,u.held-o.pointsUsed);const h=S.ledger.find(l=>l.type==='Held for '+no);if(h){h.status='spent';h.type='Spent on '+no}}
  const earn=Math.floor(o.total/100)*S.settings.ptsPerMVR*(o.mult||1);o.earned=earn;if(earn)addPts(u.id,earn,'Purchase '+no+((o.mult||1)>1?` (${o.mult}× campaign)`:''),'pending');
  if(!u.paid&&u.refBy){const r=U(u.refBy);if(r){addPts(r.id,S.settings.refReferrer,'Referral: '+u.name+' made first purchase','pending');const b=Math.round(o.total/100*S.settings.shareFirstOrderPct/100);if(b)addPts(r.id,b,S.settings.shareFirstOrderPct+'% of friend’s first order','pending')}}
  if(u.welcome)u.welcome.status='used';u.paid=true;o.log.push({at:nowISO(),ev:'Approved by '+me().name+' · '+o.items.length+' download(s) unlocked · '+earn+' points pending'});
  mail(S,u.email,'approved',{name:u.name,order:no,earned:earn});audit('Payment approved',no+' · '+mvr(o.total)+' · '+u.name);save();closeLayer();toast(`✅ ${no} approved · downloads unlocked for ${esc(u.name)}`);rerender()}
function reject(no){const o=S.orders.find(x=>x.no===no);const reason=$('#rreason').value+($('#rnote').value?' — '+$('#rnote').value:'');o.status='PAYMENT_REJECTED';o.reason=reason;if(o.tokens)o.tokens.used=true;o.log.push({at:nowISO(),ev:'Slip rejected: '+reason});
  const u=U(o.uid);mail(S,u.email,'rejected',{name:u.name,order:no,reason});audit('Payment rejected',no+' · '+reason);save();closeLayer();toast('Slip rejected · customer emailed with the reason');rerender()}
function orderModal(no){const o=S.orders.find(x=>x.no===no);const u=U(o.uid);
  modal(`<div class="flex sb wr"><h2>${o.no}</h2>${statusBadge(o.status)}</div><div class="sm mut">${esc(u.name)} · ${esc(u.email)} · ${o.method}</div>
  <div class="two mt"><div class="box"><h3>Items</h3>${o.items.map(i=>`<div class="row"><span>${esc(i.title)}</span><span>${mvr(i.final)}${i.final<i.list?` <s class="mut sm">${mvr(i.list)}</s>`:''}</span></div>`).join('')}${o.discount?`<div class="row sm"><span>Discounts</span><span>−${mvr(o.discount)}</span></div>`:''}${o.pointsUsed?`<div class="row sm"><span>Points used (${o.pointsUsed})</span><span>−${mvr(o.pointsUsed*100/S.settings.ptsPerMVRValue)}</span></div>`:''}<div class="row tot"><span>Total</span><span>${mvr(o.total)}</span></div>${o.earned?`<div class="sm mut">🪙 ${o.earned} points earned</div>`:''}</div>
   <div class="box"><h3>Timeline</h3>${o.log.map(l=>`<div class="ci" style="align-items:flex-start"><span>•</span><div class="t" style="font-weight:500">${esc(l.ev)}<div class="sm mut">${l.at.replace('T',' ')}</div></div></div>`).join('')}${o.slip?`<img src="${slipImage(o)}" style="width:110px;border-radius:8px;border:1px solid var(--line);margin-top:8px;cursor:zoom-in" data-a="zoom" data-src="${slipImage(o)}">`:''}</div></div>
  <div class="flex wr">${o.status==='AWAITING_VERIFICATION'?`<button class="btn" data-a="approveM" data-id="${no}">✅ Approve</button><button class="btn red" data-a="rejectM" data-id="${no}">Reject</button>`:''}
   ${o.status==='AWAITING_TRANSFER'||o.status==='PAYMENT_REJECTED'?`<button class="btn ghost" data-a="remind" data-id="${no}">📧 Resend payment instructions</button><button class="btn ghost" data-a="markPaid" data-id="${no}">Mark as paid (cash/other)</button>`:''}
   ${o.status==='PAID'?`<button class="btn ghost" data-a="refundM" data-id="${no}">↩️ Refund</button>`:''}<button class="btn ghost" data-a="cust" data-id="${u.id}">👤 Customer</button></div>`,true)}
function refund(no){const o=S.orders.find(x=>x.no===no);const u=U(o.uid);const reason=$('#rfr').value||'Refund';
  o.items.forEach(i=>{S.ent=S.ent.filter(e=>!(e.uid===u.id&&e.pid===i.pid))});
  if(o.earned){const l=S.ledger.find(x=>x.uid===u.id&&x.type.startsWith('Purchase '+no));if(l){if(l.status==='pending')u.pending-=l.pts;else u.points-=l.pts;l.status='reversed'}}
  if(o.pointsUsed){addPts(u.id,o.pointsUsed,'Points returned · refund '+no)}

function csvParse(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
const csvCell=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
function download(name,text,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function applyCsv(text){const rows=csvParse(text);if(rows.length<2)return toast('CSV looks empty');const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);let n=0;
  for(const r of rows.slice(1)){const fn=(r[ix('filename')]||'').trim().toLowerCase();const q=S.queue.find(x=>x.name.toLowerCase()===fn&&x.state!=='done');if(!q)continue;const m=q.meta;
    const get=k=>ix(k)>=0?(r[ix(k)]||'').trim():'';if(get('title'))m.title=get('title');if(get('description'))m.short=get('description');
    const c=get('subject');if(c){const cc=S.categories.find(x=>x.id===c.toLowerCase()||x.name.toLowerCase()===c.toLowerCase());if(cc)m.cat=cc.id}
    if(get('grade'))m.grade=get('grade');if(get('curriculum'))m.curr=get('curriculum');if(get('price_mvr')!=='')m.price=+get('price_mvr')||0;if(get('min_price_mvr')!=='')m.min=+get('min_price_mvr')||0;if(get('preview_pages'))m.pv=+get('preview_pages');if(get('featured'))m.featured=/^(y|yes|true|1)$/i.test(get('featured'));n++}
  audit('CSV details applied',n+' file(s) matched');rerender();toast(`📥 Details filled for ${n} file(s)`+(n<rows.length-1?` · ${rows.length-1-n} row(s) had no matching file in the queue`:''))}
function autoDesc(q){const m=q.meta;const r=q.res;const n=r&&r.pages?r.pages:'';const kind=r&&r.type==='PPTX'?'slide lesson':r&&r.type==='DOCX'?'editable pack':'printable pack';
  m.short=`${n?n+'-'+(r.type==='PPTX'?'slide':'page')+' ':''}${kind} for ${m.grade||'your class'} ${catName(m.cat)!=='—'?catName(m.cat):''}: ${m.title}. Classroom-ready${m.curr&&m.curr!=='—'?', aligned to the '+m.curr:''}.`.replace(/\s+/g,' ');
  const el=document.querySelector(`[data-q="${q.id}"][data-k="short"]`);if(el)el.value=m.short}

 ost:el=>{window._of.st=el.dataset.v;rerender()},
 expire:()=>{const L=S.orders.filter(o=>o.status==='AWAITING_TRANSFER'&&Date.now()-new Date(o.at)>S.settings.slipExpiryHours*36e5);L.forEach(o=>{o.status='EXPIRED';o.log.push({at:nowISO(),ev:'Expired: no transfer within '+S.settings.slipExpiryHours+'h'});if(o.pointsUsed)addPts(o.uid,o.pointsUsed,'Points returned · expired '+o.no)});audit('Orders expired',L.map(o=>o.no).join(', '));save();toast(`⏰ ${L.length} order(s) expired · held points returned`);rerender()},
 remind:el=>{const o=S.orders.find(x=>x.no===el.dataset.id);const u=U(o.uid);S.outbox.unshift({id:tok(),to:u.email,subject:`How to pay for ${o.no} – ${mvr(o.total)}`,body:`Hi ${u.name},\n\nTransfer ${mvr(o.total)} to ${S.settings.bank.bank}, ${S.settings.bank.name}, account ${S.settings.bank.number}, with reference ${o.no}. Then upload your slip on the order page.\n\n${S.settings.store}`,at:new Date().toLocaleString('en-GB')});o.log.push({at:nowISO(),ev:'Payment instructions re-sent'});audit('Reminder sent',o.no);save();toast('📧 Payment instructions sent');orderModal(o.no)},
 markPaid:el=>confirmBox('Mark as paid?','Use this only if you received the money another way (e.g. cash). Downloads will unlock.','Mark as paid',()=>{const o=S.orders.find(x=>x.no===el.dataset.id);o.slip=o.slip||{amount:o.total,ref:'Manual',sender:'—',date:today()};o.status='AWAITING_VERIFICATION';o.log.push({at:nowISO(),ev:'Marked as paid manually'});approve(o.no)}),
 refundM:el=>{modal(`<h2>↩️ Refund ${el.dataset.id}</h2><p class="mut sm">Removes the downloads from the customer's Library, reverses points earned, and returns points used. Send the money back by bank transfer separately.</p><label class="f">Reason</label><input class="inp" id="rfr" placeholder="e.g. Bought by mistake"><div class="flex mt"><button class="btn red" data-a="doRefund" data-id="${el.dataset.id}">Confirm refund</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
 doRefund:el=>refund(el.dataset.id),
 ordersCsv:()=>download('orders.csv','order,customer,email,total_mvr,points_used,status,placed\n'+S.orders.map(o=>[o.no,U(o.uid).name,U(o.uid).email,o.total/100,o.pointsUsed||0,o.status,o.at].map(csvCell).join(',')).join('\n')),
 cust:el=>{const r=$('#gsr');if(r)r.innerHTML='';custModal(el.dataset.id)},cseg:el=>{window._cf.seg=el.dataset.v;rerender()},
 custCsv:()=>download('customers.csv','name,email,joined,source,points,pending,consent,tags,referral_code\n'+customers().map(u=>[u.name,u.email,u.joined,u.source,u.points,u.pending,u.consent?'yes':'no',u.tags.join('; '),u.code].map(csvCell).join(',')).join('\n')),
 saveCust:el=>{const u=U(el.dataset.id);u.tags=$('#ctags').value.split(',').map(x=>x.trim()).filter(Boolean);u.notes=$('#cnote').value;audit('Customer updated',u.name);save();toast('💾 Saved');rerender();custModal(u.id)},
 block:el=>{const u=U(el.dataset.id);u.blocked=!u.blocked;audit(u.blocked?'Customer blocked':'Customer unblocked',u.name);save();rerender();custModal(u.id)},
 adj:el=>{const u=U(el.dataset.id);const n=parseInt($('#adjp').value,10);const r=$('#adjr').value.trim();if(!n||!r)return toast('Enter points and a reason');if(u.points+n<0)return toast('Balance can’t go below 0');addPts(u.id,n,'Adjusted by admin: '+r);audit('Points adjusted',u.name+' '+(n>0?'+':'')+n+' · '+r);save();toast('🪙 Points updated');rerender();custModal(u.id)},
 grantP:el=>{const u=U(el.dataset.id);const pid=$('#gp').value;if(!pid)return;grant(u.id,pid);audit('Resource granted',P(pid).title+' → '+u.name);save();toast('🎁 Added to '+esc(u.name)+'’s Library');custModal(u.id)},
 newCamp:()=>campModal(),editCamp:el=>campModal(el.dataset.id),
 preset:el=>{const k=el.dataset.v;const p=PRESETS[k];document.querySelectorAll('[data-a="preset"]').forEach(x=>x.classList.toggle('on',x===el));$('#ca').value=p[0];$('#cm').value=String(p[2]);$('#cb').value=p[1].replace('{pct}',$('#cp').value);if(!$('#cn').value)$('#cn').value=k+' '+new Date().getFullYear();window._preset=k},
 saveCamp:el=>{const name=$('#cn').value.trim(),pct=+$('#cp').value,st=+new Date($('#cst').value),en=+new Date($('#cen').value);if(!name)return toast('Give it a name');if(!(pct>0&&pct<=90))return toast('Discount must be 1–90%');if(!(en>st))return toast('End must be after start');
   const d={name,pct,scope:$('#cs').value,mult:+$('#cm').value,start:st,end:en,banner:$('#cb').value.trim()||pct+'% off',accent:$('#ca').value};
   const c=el.dataset.id?S.campaigns.find(x=>x.id===el.dataset.id):null;const ov=S.campaigns.find(x=>x!==c&&x.active&&x.start<en&&x.end>st);
   if(c)Object.assign(c,d);else S.campaigns.unshift(Object.assign({id:'c'+Date.now(),type:window._preset||'Custom',active:true},d));audit(c?'Campaign edited':'Campaign created',name+' · '+pct+'%');save();closeLayer();toast('📣 Saved'+(ov?` · note: overlaps “${esc(ov.name)}”; the bigger discount applies`:''));rerender()},
 togCamp:el=>{const c=S.campaigns.find(x=>x.id===el.dataset.id);c.active=!c.active;audit(c.active?'Campaign activated':'Campaign paused',c.name);save();rerender()},
 dupCamp:el=>{const c=S.campaigns.find(x=>x.id===el.dataset.id);const d=Object.assign({},c,{id:'c'+Date.now(),name:c.name+' (copy)',active:false,ended:false,start:Date.now()+864e5,end:Date.now()+8*864e5});S.campaigns.unshift(d);audit('Campaign duplicated',c.name);save();campModal(d.id);rerender()},
 sendCamp:()=>sendCampModal(),
 doSendCamp:()=>{const rule=$('#sg').value;const L=customers().filter(u=>inSeg(u,rule)&&u.consent&&!u.blocked);L.forEach(u=>S.outbox.unshift({id:tok(),to:u.email,subject:$('#sgs').value,body:fill($('#sgb').value,{name:u.name,points:u.points,store:S.settings.store}),at:new Date().toLocaleString('en-GB')}));audit('Marketing email sent',L.length+' recipient(s) · '+$('#sgs').value);save();closeLayer();toast(`✉️ Sent to ${L.length} customer(s)`);rerender()},
 addCoupon:()=>{const code=$('#ncode').value.trim().toUpperCase().replace(/\s/g,'');const pct=+$('#npct').value;if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Code: 3–20 letters/numbers');if(S.coupons.some(c=>c.code===code))return toast('That code exists');if(!(pct>0&&pct<=90))return toast('1–90% only');S.coupons.unshift({code,pct,limit:+$('#nlim').value||100,used:0,expires:$('#nexp').value,active:true});audit('Coupon created',code+' · '+pct+'%');save();rerender()},
 togCoupon:el=>{const c=S.coupons[+el.dataset.id];c.active=!c.active;audit(c.active?'Coupon enabled':'Coupon disabled',c.code);save();el.classList.toggle('on')},
 delCoupon:el=>{const c=S.coupons[+el.dataset.id];confirmBox('Delete coupon '+esc(c.code)+'?','Customers can no longer use it.','Delete',()=>{S.coupons.splice(S.coupons.indexOf(c),1);audit('Coupon deleted',c.code);save();rerender()},true)},
 wtog:el=>{S.settings.welcome.enabled=!S.settings.welcome.enabled;audit('Welcome offer '+(S.settings.welcome.enabled?'enabled':'disabled'));save();el.classList.toggle('on')},
 release:()=>{let n=0;S.ledger.filter(l=>l.status==='pending').forEach(l=>{const u=U(l.uid);u.pending-=l.pts;u.points+=l.pts;l.status='available';n+=l.pts});audit('Pending points released',n+' points');save();toast(`⏩ ${n} points now available to spend`);rerender()},
 rhome:el=>{const r=S.reviews.find(x=>x.id===el.dataset.id);r.home=!r.home;save();el.classList.toggle('on')},
 rapp:el=>{const r=S.reviews.find(x=>x.id===el.dataset.id);const first=!r.rewarded;r.status='approved';if(r.uid&&first){addPts(r.uid,S.settings.reviewPts,'Review approved');r.rewarded=true}audit('Review approved',r.name);save();rerender()},
 rhide:el=>{const r=S.reviews.find(x=>x.id===el.dataset.id);r.status='hidden';r.home=false;audit('Review hidden',r.name);save();rerender()},
 rdel:el=>confirmBox('Delete review?','This removes it permanently.','Delete',()=>{S.reviews=S.reviews.filter(x=>x.id!==el.dataset.id);save();rerender()},true),
 addTesti:()=>modal(`<h2>＋ Testimonial</h2><p class="sm mut">For feedback received outside the store (e.g. WhatsApp). It is labelled as a testimonial, not a verified review.</p><label class="f">Name</label><input class="inp" id="tn" placeholder="Hawwa N."><label class="f">Resource</label><select class="inp" id="tp">${opts(S.products.map(p=>[p.id,p.title]))}</select><label class="f">Rating</label><select class="inp" id="tr">${opts(['5','4','3'])}</select><label class="f">Text</label><textarea class="inp" id="tt" rows="3"></textarea><button class="btn mt" data-a="saveTesti">Add</button>`),
 saveTesti:()=>{const n=$('#tn').value.trim(),t=$('#tt').value.trim();if(!n||!t)return toast('Name and text please');S.reviews.unshift({id:'r'+Date.now(),pid:$('#tp').value,uid:null,name:n+' (testimonial)',rating:+$('#tr').value,text:t,status:'approved',home:true,date:today()});audit('Testimonial added',n);save();closeLayer();rerender()},
 variant:el=>{S.landing.variant=+el.dataset.id;save();rerender()},addVariant:()=>{S.landing.variants.push(Object.assign({},S.landing.variants[S.landing.variant]));S.landing.variant=S.landing.variants.length-1;save();rerender()},
 delVariant:()=>{S.landing.variants.splice(S.landing.variant,1);S.landing.variant=0;save();rerender()},
 lpbg:el=>{S.landing.bg=el.dataset.id;save();rerender()},annTog:el=>{S.landing.announce.on=!S.landing.announce.on;save();el.classList.toggle('on');$('#lpprev').innerHTML=lpPreview()},
 mv:el=>{const i=+el.dataset.i,d=+el.dataset.d,s=S.landing.sections;[s[i],s[i+d]]=[s[i+d],s[i]];save();rerender()},
 sec:el=>{const s=S.landing.sections[+el.dataset.id];s.on=!s.on;save();el.classList.toggle('on');$('#lpprev').innerHTML=lpPreview()},
 addFaq:()=>{S.landing.faq.push(['New question?','Answer']);save();rerender()},delFaq:el=>{S.landing.faq.splice(+el.dataset.id,1);save();rerender()},
 publishLP:()=>{const L=S.landing;const snap=JSON.parse(JSON.stringify(Object.assign({},L,{history:undefined})));L.history.unshift({at:new Date().toLocaleString('en-GB'),snap});L.history=L.history.slice(0,5);audit('Landing page published','Variant '+String.fromCharCode(65+L.variant));save();toast('🚀 Landing page is live');rerender()},
 lpHistory:()=>modal(`<h2>🕘 Published versions</h2>${S.landing.history.map((h,i)=>`<div class="row"><span>${h.at} · “${esc(h.snap.variants[h.snap.variant].h1.replace(/<[^>]+>/g,''))}”</span><button class="btn xs ghost" data-a="rollback" data-id="${i}">Restore</button></div>`).join('')}`),
 rollback:el=>{const h=S.landing.history[+el.dataset.id];const hist=S.landing.history;S.landing=Object.assign(JSON.parse(JSON.stringify(h.snap)),{history:hist});audit('Landing page restored',h.at);save();closeLayer();toast('↺ Restored. Publish to make it live again.');rerender()},
 tpl:el=>{window._tk=el.dataset.v;rerender()},
 testMail:()=>{const k=window._tk||'welcome';mail(S,owner().email,k,{name:owner().name,order:'LL-2026-000999',amount:'MVR 75',points:50,pct:S.settings.welcome.pct,days:S.settings.welcome.days,earned:75,reason:'Sample reason',title:'Sample resource',version:2,note:'Sample change'});save();toast('📧 Test sent to '+esc(owner().email));rerender()},
 restampAll:()=>restampAll(),
 editBank:()=>{const b=S.settings.bank;modal(`<h2>🏦 Change bank details</h2><div class="warnbox">Customers transfer money to this account. Double-check every digit.</div><label class="f">Bank</label><input class="inp" id="bb" value="${esc(b.bank)}"><label class="f">Account name</label><input class="inp" id="bn" value="${esc(b.name)}"><label class="f">Account number</label><input class="inp" id="bno" value="${esc(b.number)}"><label class="f">Type the account number again</label><input class="inp" id="bno2" autocomplete="off"><div class="flex mt"><button class="btn" data-a="saveBank">🔐 Confirm with Google & save</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
 saveBank:()=>{if($('#bno').value.replace(/\s/g,'')!==$('#bno2').value.replace(/\s/g,''))return toast('⛔ Account numbers don’t match');Object.assign(S.settings.bank,{bank:$('#bb').value,name:$('#bn').value,number:$('#bno').value});S.settings.admins.forEach(e=>S.outbox.unshift({id:tok(),to:e,subject:'Security alert: bank details changed',body:'The bank account shown at checkout was changed by '+me().name+'. If this wasn’t you, sign in and change it back immediately.',at:new Date().toLocaleString('en-GB')}));audit('Bank details changed','Account ending '+$('#bno').value.slice(-4));save();closeLayer();toast('🏦 Saved · all admins notified');rerender()},
 gtog:el=>{toast('Google sign-in is the only login method in this release, so it stays on.')},
 addAdmin:()=>{const e=$('#nadmin').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast('Enter a valid Google email');if(S.settings.admins.includes(e))return;confirmBox('Add admin?',esc(e)+' will have full access to the backend.','Add admin',()=>{S.settings.admins.push(e);audit('Admin added',e);save();rerender()})},
 delAdmin:el=>{const e=S.settings.admins[+el.dataset.id];confirmBox('Remove admin?',esc(e)+' will lose access.','Remove',()=>{S.settings.admins.splice(+el.dataset.id,1);audit('Admin removed',e);save();rerender()},true)},
 exportJson:()=>{const data={exported:new Date().toISOString(),state:Object.assign({},S,{queue:[],session:null}),images:IMG};download('lessonlagoon-backup-'+today()+'.json',JSON.stringify(data),'application/json');audit('Backup exported','')},
 importJson:()=>$('#fjson').click(),
 resetAll:()=>confirmBox('Reset everything?','All changes in this browser are cleared and the sample store is reloaded.','Reset',()=>{localStorage.removeItem(KEY);DB.clear();S=fresh();S.queue=[];S.session=owner().id;FILES={};save();route();toast('↺ Demo reset')},true)};
function openMail(id,orderNo){const e=S.outbox.find(x=>x.id===id);const o=orderNo?S.orders.find(x=>x.no===orderNo):e.orderNo?S.orders.find(x=>x.no===e.orderNo):null;
  modal(`<div class="gm"><div class="hd"><h3>${esc(e.subject)}</h3><b>${esc(S.settings.store)}</b> &lt;noreply@${esc(S.settings.store.toLowerCase())}.mv&gt; to ${esc(e.to)} · ${e.at}</div><div class="bd">${esc(e.body).replace('[APPROVE]  [REJECT]','')}${o?`\n<img src="${slipImage(o)}" style="max-width:200px;border:1px solid #ddd;border-radius:6px">\n${o.status==='AWAITING_VERIFICATION'?`<a class="abtn" style="background:#16A34A;cursor:pointer" data-a="approveM" data-id="${o.no}">APPROVE</a><a class="abtn" style="background:#DC2626;cursor:pointer" data-a="rejectM" data-id="${o.no}">REJECT</a>`:'<b>This payment has already been processed.</b>'}`:''}</div></div>`,true)}
function importJson(t){try{const d=JSON.parse(t);if(!d.state||!d.state.products)throw new Error('Not a LessonLagoon backup');DB.clear();S=d.state;S.queue=[];S.session=owner().id;Object.entries(d.images||{}).forEach(([k,v])=>DB.put(k,v));audit('Backup imported',d.exported||'');save();route();toast('📥 Backup restored')}catch(e){toast('⛔ '+esc(e.message))}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='bgclose'){if(e.target===el)closeLayer();return}const f=A[el.dataset.a];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')==='javascript:void 0')e.preventDefault();
  if(el.type==='checkbox'){f(el,e);return}e.preventDefault&&el.tagName!=='INPUT'&&e.preventDefault();f(el,e)});
/* drop anywhere + keyboard */
let dragN=0;const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(!me()||!hasFiles(e))return;dragN++;$('#dropall').classList.add('on')});
addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragN=Math.max(0,dragN-1);if(!dragN)$('#dropall').classList.remove('on')});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragN=0;$('#dropall').classList.remove('on');if(me())enqueue(e.dataTransfer.files)});
addEventListener('paste',e=>{if(!me())return;const fs=[...(e.clipboardData||{}).files||[]].filter(f=>ALLOWED.includes(f.name.split('.').pop().toLowerCase()));if(fs.length)enqueue(fs)});
addEventListener('keydown',e=>{if(!me())return;const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;if(e.key==='Escape')closeLayer();if(e.key==='u'||e.key==='U'){e.preventDefault();$('#fpick').click()}if(e.key==='/'){e.preventDefault();const g=$('#gsq');g&&g.focus()}});
addEventListener('beforeunload',e=>{if(S&&S.queue.some(q=>q.state==='ready'||q.state==='processing'||q.state==='queued')){e.preventDefault();e.returnValue=''}});
addEventListener('hashchange',()=>{closeLayer();route()});
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(el=>{const t=+el.dataset.cd-Date.now();el.textContent=t>0?fmtDur(t):'ended'}),30000);
/* boot */
(async()=>{load();await DB.open();IMG=Object.assign(await DB.all(),IMG);if(!location.hash)location.hash='#/dash';route()})();
</script>
