function startHero(cv,preset){const x=cv.getContext('2d');let W,H,raf,run=true,vis=true;const m={x:-999,y:-999};const dpr=Math.min(2,devicePixelRatio||1);

  const N=innerWidth<700?26:(preset==='network'?70:46);const cols=['#0E8C7F','#FF7A59','#F5B300','#38C6B3','#7C3AED'];
  const ps=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:-.15-Math.random()*.35,r:6+Math.random()*14,k:Math.floor(Math.random()*5),c:cols[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.01}));

  function shape(p){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=.22;x.fillStyle=p.c;x.strokeStyle=p.c;x.lineWidth=3;
    if(p.k===0){x.beginPath();x.arc(0,0,p.r,0,7);x.fill()}
    else if(p.k===1){x.beginPath();for(let i=0;i<10;i++){const rr=i%2?p.r*.45:p.r;x.lineTo(Math.cos(i*Math.PI/5)*rr,Math.sin(i*Math.PI/5)*rr)}x.fill()}
    else if(p.k===2){x.fillRect(-p.r*1.4,-p.r*.3,p.r*2.4,p.r*.6);x.beginPath();x.moveTo(p.r,-p.r*.3);x.lineTo(p.r*1.6,0);x.lineTo(p.r,p.r*.3);x.fill()}
    else if(p.k===3){x.strokeRect(-p.r,-p.r*.7,p.r*2,p.r*1.4);x.beginPath();x.moveTo(0,-p.r*.7);x.lineTo(0,p.r*.7);x.stroke()}
    else{x.beginPath();x.moveTo(0,-p.r);x.lineTo(p.r,p.r);x.lineTo(-p.r,p.r);x.closePath();x.fill()}x.restore()}
  let t=0;function frame(){if(!run)return;raf=requestAnimationFrame(frame);if(!vis||document.hidden)return;t+=.005;x.clearRect(0,0,W,H);
    if(preset==='gradient'){[[.2,.3,'#38C6B355'],[.75,.4,'#FF7A5944'],[.5,.8,'#F5B30033']].forEach(([a,b,c],i)=>{const cx=W*(a+.12*Math.sin(t*2+i)),cy=H*(b+.1*Math.cos(t*1.6+i));const px=m.x>0?(m.x-cx)*.08:0;const g=x.createRadialGradient(cx+px,cy,0,cx+px,cy,Math.max(W,H)*.45);g.addColorStop(0,c);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H)});return}
    for(const p of ps){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
      if(preset==='network'){if(d<140){p.vx-=dx/d*.02;p.vy-=dy/d*.02}p.vx*=.99;p.vy*=.99;p.vx+=(Math.random()-.5)*.02;p.vy+=(Math.random()-.5)*.02}
      else if(d<120){p.x+=dx/d*3;p.y+=dy/d*3}
      p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30;if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30}
    if(preset==='network'){x.lineWidth=1;for(let i=0;i<ps.length;i++){const a=ps[i];for(let j=i+1;j<ps.length;j++){const b=ps[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){x.strokeStyle=`rgba(14,140,127,${.25*(1-d/120)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
      x.fillStyle='rgba(14,140,127,.55)';x.beginPath();x.arc(a.x,a.y,2.6,0,7);x.fill();const dm=Math.hypot(a.x-m.x,a.y-m.y);if(dm<160){x.strokeStyle=`rgba(255,122,89,${.5*(1-dm/160)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke()}}}
    else ps.forEach(shape)}

let pdfjsP=null;function loadPdfjs(){return pdfjsP||(pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(pdfjsLib)};s.onerror=rej;document.head.appendChild(s)}))}
async function handleUpload(files){const f=files[0];if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(!['pdf','docx','pptx','doc','ppt'].includes(ext))return toast('⛔ File type not allowed');
  const type=ext.startsWith('ppt')?'PPTX':ext.startsWith('doc')?'DOCX':'PDF';window._np.type=type;window._np.name=f.name;if(!$('#nt').value)$('#nt').value=f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
  const steps=[['Uploading to quarantine storage','up'],['Virus scan (ClamAV) & file-type check','scan'],[type==='PDF'?'PDF detected – no conversion needed':'Converting '+type+' → PDF (LibreOffice headless)','conv'],['Rendering pages (pdf.js → canvas)','rend'],['Burning watermark into pixels (sharp) → WebP','wm'],['Ready','ok']];
  const box=$('#procbox');const draw=k=>{box.innerHTML=`<div class="proc">${steps.map((s,i)=>`<div class="${i<k?'ok':i===k?'run':''}">${i<k?'✅':i===k?'⏳':'○'} ${s[0]}</div>`).join('')}</div>`};
  const npv=+$('#npv').value||3;let pages=[],count=npv*3;
  for(let k=0;k<steps.length-1;k++){draw(k);await new Promise(r=>setTimeout(r,k===3?200:550));
    if(k===3){try{if(type!=='PDF')throw 0;const lib=await loadPdfjs();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;count=doc.numPages;
      for(let i=1;i<=Math.min(npv,doc.numPages);i++){const pg=await doc.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:900/vp0.width});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push(c)}}
      catch(e){pages=[]}}
    if(k===4){window._np.pages=pages.map(c=>{const x=c.getContext('2d');watermark(x,c.width,c.height,null);return c.toDataURL('image/webp',.8)})}}
  window._np.count=count;draw(steps.length);
  box.innerHTML+=`<div class="sm mut">${f.name} · ${(f.size/1048576).toFixed(1)} MB · ${type==='PDF'&&pages.length?count+' pages detected':'pages estimated (conversion runs on the server in production)'}</div><div class="pvrow mt">${(window._np.pages.length?window._np.pages:[1,2,3].slice(0,npv).map(i=>previewPage({id:'tmp'+i,title:$('#nt').value,grade:$('#ng').value,type,pages:count,color:'#0E8C7F',ic:'📘'},i))).map(s=>`<img src="${s}">`).join('')}</div>`}
function publishProduct(){const np=window._np;const t=$('#nt').value.trim();if(!t)return toast('Add a title');const pr=Math.round(+$('#npr').value*100),mn=Math.round(+$('#nmin').value*100);if(pr&&(mn<=0||mn>pr))return toast('⛔ Minimum price must be above 0 and not more than the price');
  const id='p'+(S.products.length+1+Math.floor(Math.random()*900));const slug=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+id;
  S.products.unshift({id,slug,title:t,short:$('#nd').value||'A brand-new teacher-made resource.',cat:$('#nc').value,grade:$('#ng').value,type:np.type||'PDF',pages:np.count||12,price:pr,min:pr?mn:0,featured:true,rating:5,rc:0,color:['#0E8C7F','#7C3AED','#0284C7','#DB2777','#EA580C'][Math.floor(Math.random()*5)],ic:'📘',status:'Published',sales:0,curr:'National Curriculum',custom:np.pages&&np.pages.length?np.pages:null});

 sec:d=>{const s=S.landing.sections[d.i];s.on=!s.on;route()},mv:d=>{const a=S.landing.sections,i=+d.i,j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];route()},
 publishLP:()=>{document.querySelectorAll('[data-lp]').forEach(i=>S.landing.variants[S.landing.variant][i.dataset.lp]=i.value);route();toast('✅ Landing page published (version saved)')},
 rhome:d=>{const r=S.reviews.find(x=>x.id===d.id);r.home=!r.home;route()},rapp:d=>{const r=S.reviews.find(x=>x.id===d.id);r.status='approved';if(r.uid&&!r.ptsGiven){r.ptsGiven=1;addPts(r.uid,S.settings.reviewPts,'Approved review')}route()},rhide:d=>{S.reviews.find(x=>x.id===d.id).status='hidden';route()},
 addTesti:()=>{const t=prompt('Testimonial text');if(!t)return;const n=prompt('Name','Principal, Thinadhoo School');S.reviews.unshift({id:'r'+Date.now(),pid:'p1',uid:null,name:n+' (testimonial)',rating:5,text:t,status:'approved',home:true,date:new Date().toISOString().slice(0,10)});route()},
 cust:d=>custModal(d.id),saveNote:d=>{U(d.id).notes=$('#cnote').value;toast('Note saved')},
 adj:d=>{const p=parseInt($('#adjp').value),r=$('#adjr').value.trim();if(!p||!r)return toast('Points and a reason are required');addPts(d.id,p,'Admin adjustment: '+r);custModal(d.id);toast('Points adjusted (audited)')},
 grantP:d=>{grant(d.id,$('#gp').value);custModal(d.id);toast('Access granted (audited)')},
 csv:()=>{const rows=[['Name','Email','Joined','Source','Points','Consent']].concat(S.users.filter(u=>u.role==='CUSTOMER').map(u=>[u.name,u.email,u.joined,u.source,u.points,u.consent?'yes':'no']));const csv=rows.map(r=>r.map(v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='customers.csv';a.click()},
 newCamp:newCampModal,saveCamp:()=>{S.campaigns.forEach(c=>{if(c.active)c.active=false});S.campaigns.unshift({id:'c'+Date.now(),name:$('#cn').value,type:$('#ct').value,pct:+$('#cp').value,scope:'all',mult:+$('#cm').value||1,active:true,start:+new Date($('#cs').value),end:+new Date($('#ce').value),accent:$('#ca').value,banner:$('#cb').value});closeLayer();route();toast('📣 Campaign scheduled. Prices, banner and badges update automatically.')},
 togCamp:d=>{const c=S.campaigns.find(x=>x.id===d.id);if(!c.active)S.campaigns.forEach(x=>x.active=false);c.active=!c.active;if(c.active&&c.ended){c.start=Date.now();c.end=Date.now()+3*864e5;c.ended=false}route()},
 dupCamp:d=>{const c=S.campaigns.find(x=>x.id===d.id);S.campaigns.push({...c,id:'c'+Date.now(),name:c.name+' (copy)',active:false,ended:false});route();toast('Duplicated. Set the new dates and activate.')},
 addCoupon:()=>{const c=$('#ncode').value.trim().toUpperCase(),p=+$('#npct').value;if(!c||!p)return;S.coupons.push({code:c,pct:p,limit:100,used:0,expires:'2026-12-31'});route()},
 wtog:()=>{S.settings.welcome.enabled=!S.settings.welcome.enabled;route()},
 saveSet:()=>{document.querySelectorAll('[data-set]').forEach(i=>{const ks=i.dataset.set.split('.');let o=S.settings;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=+i.value});route();toast('✅ Rules saved')},
 release:()=>{S.users.forEach(u=>{if(u.pending){u.points+=u.pending;u.pending=0}});S.ledger.forEach(l=>{if(l.status==='pending')l.status='available'});route();toast('⏩ Pending points released')},
 saveBank:()=>{if(!confirm('Re-authenticate with Google to change bank details?'))return;document.querySelectorAll('[data-bank]').forEach(i=>S.settings.bank[i.dataset.bank]=i.value);custEmail('admin','Security: bank account details were changed');toast('🔐 Bank details saved · all admins notified')},
 saveWm:()=>{S.settings.watermark=$('#wmt').value;S.settings.previewPages=+$('#pvp').value;S.settings.slipExpiryHours=+$('#sexp').value;Object.keys(imgCache).forEach(k=>{if(k.startsWith('pv'))delete imgCache[k]});toast('🔁 Previews regenerated with new watermark')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=acts[el.dataset.a];if(f){if(el.tagName==='A'&&!el.getAttribute('href'))e.preventDefault();f(el.dataset,e)}});
document.addEventListener('input',e=>{if(e.target.id==='ptsr'){S.usePts=+e.target.value;$('#ptsv').textContent=S.usePts;const T=totals();$('#ptsm').textContent=mvr(T.ptsL);clearTimeout(window._pt);window._pt=setTimeout(route,350)}
  if(e.target.id==='cq'){window._cq=e.target.value;clearTimeout(window._cqt);window._cqt=setTimeout(()=>{route();const i=$('#cq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch){const p=P(t.dataset.id);const v=Math.round(+t.value*100);
  if(t.dataset.ch==='price'){if(p.price&&v<p.min){toast('⛔ Price can\'t be below the minimum price');t.value=p.price/100;return}p.price=v}else{if(v<=0||v>p.price){toast('⛔ Minimum must be above 0 and ≤ price');t.value=p.min/100;return}p.min=v}route();toast('Saved · price history recorded')}});
function tick(){document.querySelectorAll('[data-cd]').forEach(el=>{const ms=+el.dataset.cd-Date.now();if(ms<0){el.textContent='ended';return}const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;el.textContent=(d?d+'d ':'')+h+'h '+m+'m '+s+'s'});
  document.querySelectorAll('[data-cdbox]').forEach(el=>{const ms=Math.max(0,+el.dataset.cdbox-Date.now());const v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];el.innerHTML=v.map((n,i)=>`<div><b>${String(n).padStart(2,'0')}</b><small>${['days','hrs','min','sec'][i]}</small></div>`).join('')});
  if($('#allgrid')&&!$('#allgrid').dataset.r){$('#allgrid').dataset.r=1;renderAllGrid()}}
setInterval(tick,1000);
addEventListener('hashchange',route);
boot();route();
</script>
</body>
</html>
